[project]
name = "feedstock-maintainers"
version = "0.1.0"
description = "Extract extra.recipe-maintainers from conda-forge feedstock recipes"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.scripts]
feedstock-maintainers = "feedstock_maintainers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.9"
click = ">=8.1"
pyyaml = ">=6.0"
jinja2 = ">=3.1"
rich = ">=13.0"
httpx = ">=0.27"

[tool.pixi.pypi-dependencies]
feedstock-maintainers = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=7.0"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
scan = "feedstock-maintainers"

[tool.pixi.feature.test.tasks]
test = "pytest"
