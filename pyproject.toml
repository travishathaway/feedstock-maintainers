[project]
name = "feedstock-maintainers"
version = "0.1.0"
description = "Extract extra.recipe-maintainers from conda-forge feedstock recipes"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
feedstock-maintainers = "feedstock_maintainers.cli:main"
fsm = "feedstock_maintainers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.9"
click = ">=8.1"
pyyaml = ">=6.0"
jinja2 = ">=3.1"
rich = ">=13.0"
httpx = ">=0.27"
networkx = ">=3.0"
numpy = ">=1.24"
scipy = ">=1.10"

[tool.pixi.pypi-dependencies]
feedstock-maintainers = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.0"
prek = ">=0.4.10"
mypy = ">=1.16"
types-pyyaml = ">=6.0"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
fetch-feedstocks = "feedstock-maintainers fetch feedstocks"
fetch-maintainer-info = "feedstock-maintainers fetch maintainer-info"
generate-maintainers = "feedstock-maintainers generate maintainers"
generate-graph-data = "feedstock-maintainers generate graph-data --output web/static/data/maintainer-graph.json"

[tool.pixi.feature.dev.tasks]
test = "pytest"
lint = "prek run --all-files"
lint-install = "prek install"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length    = 100
src            = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no print() in production code)
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",  # assert used — fine in tests
    "S105",  # possible hardcoded password — too many false positives in config files
    "S106",  # possible hardcoded password in func arg
    "T201",  # print() — we have a few debug prints in routes we want to keep for now
    "B008",  # do not perform function calls in default arguments — Flask does this
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]   # security + print rules relaxed in tests

[tool.ruff.lint.isort]
known-first-party = ["thath_idp"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version            = "3.10"
files                     = ["src/feedstock_maintainers"]
strict                    = false
ignore_missing_imports    = true
warn_unused_ignores       = true
warn_return_any           = false
disallow_untyped_defs     = false
check_untyped_defs        = true
