name: Reset cache

on:
  workflow_dispatch:

permissions:
  actions: write

env:
  ARTIFACT_NAME: recipe-cache

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all recipe-cache artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = process.env.ARTIFACT_NAME;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const matches = artifacts.filter(a => a.name === artifactName && !a.expired);

            if (matches.length === 0) {
              core.info(`No non-expired artifacts named '${artifactName}' found. Nothing to delete.`);
              return;
            }

            for (const artifact of matches) {
              core.info(`Deleting artifact id=${artifact.id} (created ${artifact.created_at}) from run ${artifact.workflow_run?.id ?? 'unknown'}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

            core.info(`Deleted ${matches.length} artifact(s) named '${artifactName}'.`);
        env:
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
