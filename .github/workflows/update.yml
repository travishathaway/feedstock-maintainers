name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0/3 * * *'   # every three hours, on the hour (UTC)

env:
  ARCHIVE_NAME: recipe_cache.tar.gz
  ARTIFACT_NAME: recipe-cache
  SEED_URL: https://emsde.thath.net/recipe_cache.tar.gz

jobs:
  find-source:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      since: ${{ steps.find.outputs.since }}
    steps:
      - name: Find latest successful run with a live artifact
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = process.env.ARTIFACT_NAME;

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update.yml',
              status: 'success',
              per_page: 20,
            });

            for (const run of data.workflow_runs) {
              const { data: artifactsData } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });

              const match = artifactsData.artifacts.find(
                a => a.name === artifactName && !a.expired
              );

              if (match) {
                core.info(`Using run ${run.id} (created ${run.created_at}), artifact id ${match.id}`);
                core.setOutput('run_id', run.id);
                // Buffered by 10 minutes to cover clock skew and the previous run's own
                // execution time, so we never miss a commit made during that run.
                const since = new Date(new Date(run.created_at).getTime() - 10 * 60 * 1000);
                core.setOutput('since', since.toISOString());
                return;
              }

              core.info(`Run ${run.id} succeeded but has no live '${artifactName}' artifact, skipping.`);
            }

            core.info('No successful run with a live artifact found. Falling back to seed URL.');
            core.setOutput('run_id', '');  // signals: no prior artifact, fall back to seed URL
            core.setOutput('since', '');    // signals: no diff to compute, fetch everything
        env:
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}

  update:
    needs: find-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download previous artifact
        if: needs.find-source.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .
          run-id: ${{ needs.find-source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Seed from external URL (first run / no prior artifact)
        if: needs.find-source.outputs.run_id == ''
        run: |
          curl -fLsS -o "${{ env.ARCHIVE_NAME }}" "${{ env.SEED_URL }}"

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.73.0
          environments: default
          cache: true

      - name: Extract archive
        run: |
          tar -xzf "${{ env.ARCHIVE_NAME }}"

      - name: Update recipes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE: ${{ needs.find-source.outputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            pixi run fsm fetch feedstocks --since "$SINCE"
          else
            pixi run fsm fetch feedstocks
          fi

          pixi run fsm generate maintainers
          pixi run fsm fetch maintainer-info
          pixi run fsm generate graph-data

      - name: Recompile archive
        run: |
          tar -czf "${{ env.ARCHIVE_NAME }}" \
            recipe_cache \
            maintainers.json \
            maintainers-not-found.json \
            maintainer-info.json \
            graph-data.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 1
          if-no-files-found: error
