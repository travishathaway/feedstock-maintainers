name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0/3 * * *'   # every three hours, on the hour (UTC)
  # Called by cold-start.yml (manual only) to run one collection routine in full. Not meant to be
  # triggered directly -- use the cold-start workflow.
  workflow_call:
    inputs:
      routine:
        description: Collection routine to run in full (feedstock-activity or feedstock-health-signals)
        type: string
        default: ''
      force:
        description: Re-fetch every top-tier feedstock, even ones fetched recently
        type: boolean
        default: false

# Scheduled/manual runs never overlap a cold-start run (which holds the same group via
# cold-start.yml), so neither can overwrite the other's artifact. When called from cold-start.yml
# the group is made unique: the caller already holds `recipe-cache`, and reusing it here would
# deadlock.
concurrency:
  group: ${{ inputs.routine && format('cold-start-inner-{0}', github.run_id) || 'recipe-cache' }}
  cancel-in-progress: false

env:
  ARCHIVE_NAME: recipe_cache.tar.gz
  ARTIFACT_NAME: recipe-cache
  SEED_URL: https://emsde.thath.net/recipe_cache.tar.gz

jobs:
  find-source:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      since: ${{ steps.find.outputs.since }}
    steps:
      - name: Find latest successful run with a live artifact
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = process.env.ARTIFACT_NAME;

            // A cold-start run executes this same pipeline (via workflow_call), but GitHub records
            // it under cold-start.yml, so both workflows' runs have to be considered. Every run
            // of either does a full recipe refresh, so any one of them is a valid baseline.
            const runs = [];
            for (const workflow_id of ['update.yml', 'cold-start.yml']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                status: 'success',
                per_page: 20,
              });
              runs.push(...data.workflow_runs);
            }
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            for (const run of runs) {
              const { data: artifactsData } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });

              const match = artifactsData.artifacts.find(
                a => a.name === artifactName && !a.expired
              );

              if (match) {
                core.info(`Using run ${run.id} (created ${run.created_at}), artifact id ${match.id}`);
                core.setOutput('run_id', run.id);
                // Buffered by 10 minutes to cover clock skew and the previous run's own
                // execution time, so we never miss a commit made during that run.
                const since = new Date(new Date(run.created_at).getTime() - 10 * 60 * 1000);
                core.setOutput('since', since.toISOString());
                return;
              }

              core.info(`Run ${run.id} succeeded but has no live '${artifactName}' artifact, skipping.`);
            }

            core.info('No successful run with a live artifact found. Falling back to seed URL.');
            core.setOutput('run_id', '');  // signals: no prior artifact, fall back to seed URL
            core.setOutput('since', '');    // signals: no diff to compute, fetch everything
        env:
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}

  update:
    needs: find-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download previous artifact
        if: needs.find-source.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .
          run-id: ${{ needs.find-source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Seed from external URL (first run / no prior artifact)
        if: needs.find-source.outputs.run_id == ''
        run: |
          curl -fLsS -o "${{ env.ARCHIVE_NAME }}" "${{ env.SEED_URL }}"

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.78.0
          environments: default
          cache: true

      - name: Extract archive
        run: |
          tar -xzf "${{ env.ARCHIVE_NAME }}"

      - name: Update recipes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a token that can read the conda-forge org's teams (the default
          # GITHUB_TOKEN is repo-scoped and usually can't). Used only for `fetch team-members`.
          TEAM_READ_TOKEN: ${{ secrets.TEAM_READ_TOKEN }}
          SINCE: ${{ needs.find-source.outputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            pixi run fsm fetch feedstocks --since "$SINCE"
          else
            pixi run fsm fetch feedstocks
          fi

          pixi run fsm generate maintainers
          pixi run fsm fetch maintainer-info --maintainers-file maintainers.json
          pixi run fsm generate maintainer-countries
          pixi run fsm generate maintainer-graph --output maintainer-graph.json
          # Count the people behind team handles (conda-forge/r, ...). Needs a token that can read
          # the org's teams; without one, teams count no members and the run never fails.
          # PRIVACY: team membership must never be cached or published. team-members.json is
          # reduced to per-feedstock head counts and deleted straight away, so it can never end
          # up in the archive/artifact below.
          rm -f team-members.json
          GITHUB_TOKEN="${TEAM_READ_TOKEN:-$GITHUB_TOKEN}" pixi run fsm fetch team-members
          pixi run fsm generate listed-maintainer-counts
          rm -f team-members.json
          pixi run fsm generate package-maintainers
          pixi run fsm generate package-graph -p linux-64 -p noarch --output package-graph.json
          pixi run fsm generate transitive-dependencies -p linux-64 -p noarch --output transitive-dependencies.json

      - name: Fetch package download stats
        run: |
          pixi run fsm fetch package-downloads

      - name: Fetch package about metadata
        run: |
          pixi run fsm fetch package-about --package-maintainers-file package-maintainers.json

      - name: Update feedstock activity tier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE: ${{ needs.find-source.outputs.since }}
          ROUTINE: ${{ inputs.routine }}
          FORCE: ${{ inputs.force }}
        run: |
          pixi run fsm generate feedstock-tiers \
            --package-names-file package-names.json \
            --package-downloads-file package-downloads.json \
            --transitive-dependencies-file transitive-dependencies.json \
            --output feedstock-tiers.json

          # Only ever an incremental fetch here (tier members changed since the last run) -- a
          # full top-tier fetch is expensive enough (unlike fetch-feedstocks' cold-start fetch)
          # that it's kept out of this 3-hourly job entirely, same rationale as the full
          # maintainer-info refresh in NOTES.md. On a cold start (no $SINCE -- no prior artifact)
          # this step is skipped and feedstock-activity.json simply isn't produced until either a
          # manual `fsm fetch feedstock-activity` run (no --since) seeds
          # feedstock-activity-raw.json, or the next run's incremental fetch starts accumulating
          # history on its own -- every downstream consumer already treats missing activity data
          # as "not collected yet", not an error.
          if [ "$ROUTINE" = "feedstock-activity" ]; then
            # Cold start (manual, see cold-start.yml): no --since, so every top-tier feedstock that
            # was never fetched (or is stale) is collected, not just recently-changed ones.
            FORCE_FLAG=""; [ "$FORCE" = "true" ] && FORCE_FLAG="--force"
            pixi run fsm fetch feedstock-activity \
              --tiers-file feedstock-tiers.json --tier top $FORCE_FLAG \
              --output feedstock-activity-raw.json
          elif [ -n "$SINCE" ]; then
            pixi run fsm fetch feedstock-activity \
              --tiers-file feedstock-tiers.json --tier top --since "$SINCE" \
              --output feedstock-activity-raw.json
          fi

          # Guarantee this exists before it's tarred up below, even on a true cold start (no
          # prior artifact, so the fetch above was skipped and nothing has ever written it).
          [ -f feedstock-activity-raw.json ] || echo '{}' > feedstock-activity-raw.json

          pixi run fsm generate feedstock-activity \
            --raw-file feedstock-activity-raw.json \
            --maintainers-file maintainers.json \
            --output feedstock-activity.json

      - name: Update feedstock health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE: ${{ needs.find-source.outputs.since }}
          ROUTINE: ${{ inputs.routine }}
          FORCE: ${{ inputs.force }}
        run: |
          # Capped per run (--limit): feedstocks never fetched or older than --staleness-days
          # are picked up gradually across runs rather than in one large burst, so a cold start
          # fills in over a few 3-hourly runs. Like the activity fetch above, skipped on a true
          # cold start (no prior artifact) and every consumer treats missing health data as
          # "not collected yet", not an error.
          if [ "$ROUTINE" = "feedstock-health-signals" ]; then
            # Cold start (manual, see cold-start.yml): no --since and no --limit, so every
            # top-tier feedstock that was never fetched (or is stale) is collected in this run.
            FORCE_FLAG=""; [ "$FORCE" = "true" ] && FORCE_FLAG="--force"
            pixi run fsm fetch feedstock-health-signals \
              --tiers-file feedstock-tiers.json --tier top $FORCE_FLAG \
              --output feedstock-health-signals-raw.json
          elif [ -n "$SINCE" ]; then
            pixi run fsm fetch feedstock-health-signals \
              --tiers-file feedstock-tiers.json --tier top --since "$SINCE" --limit 600 \
              --output feedstock-health-signals-raw.json
          fi

          [ -f feedstock-health-signals-raw.json ] || echo '{}' > feedstock-health-signals-raw.json

          pixi run fsm generate feedstock-health \
            --signals-file feedstock-health-signals-raw.json \
            --maintainers-file maintainers.json \
            --activity-raw-file feedstock-activity-raw.json \
            --activity-file feedstock-activity.json \
            --package-names-file package-names.json \
            --transitive-dependencies-file transitive-dependencies.json \
            --output feedstock-health.json

      - name: Update maintainer + feedstock count history (monthly)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pixi run fsm generate maintainer-history-append \
            --maintainers-file maintainers.json \
            --history-file maintainer-history.json

          pixi run fsm fetch feedstock-count-history-backfill

          pixi run fsm generate feedstock-count-append \
            --maintainers-file maintainers.json \
            --history-file feedstock-count-history.json

      - name: Recompile archive
        run: |
          # PRIVACY guard: never archive (or publish) team membership.
          if [ -e team-members.json ]; then echo "team-members.json must not be archived" >&2; exit 1; fi
          tar -czf "${{ env.ARCHIVE_NAME }}" \
            recipe_cache \
            maintainers.json \
            maintainers-not-found.json \
            maintainer-info.json \
            maintainer-countries.json \
            maintainer-graph.json \
            package-graph.json \
            package-names.json \
            package-maintainers.json \
            listed-maintainer-counts.json \
            package-downloads.json \
            package-about.json \
            licenses.json \
            transitive-dependencies.json \
            maintainer-history.json \
            feedstock-count-history.json \
            feedstock-tiers.json \
            feedstock-activity-raw.json \
            feedstock-activity.json \
            feedstock-health-signals-raw.json \
            feedstock-health.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 1
          if-no-files-found: error
